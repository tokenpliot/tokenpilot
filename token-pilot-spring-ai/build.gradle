dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.0')
    api platform('org.springframework.ai:spring-ai-bom:2.0.0')

    api project(':token-pilot-core')
    api project(':token-pilot-budget')

    api 'org.springframework.ai:spring-ai-model'
    api 'org.springframework.ai:spring-ai-client-chat'
    
    // Reactor (스트리밍 처리를 위한 Flux 등)
    api 'io.projectreactor:reactor-core'

    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
}
