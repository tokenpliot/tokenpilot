global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'token-pilot-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # The Spring Boot app in the demo profile runs on the host,
      # and Prometheus scrapes it through host.docker.internal.
      - targets: ['host.docker.internal:8080']
