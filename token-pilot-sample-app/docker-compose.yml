services:
  prometheus:
    build: ./prometheus       # 👈 Use a local build consistently, like Grafana.
    container_name: prometheus
    ports:
      - "9090:9090"
    extra_hosts:              # 👈 Allow communication with the local Spring Boot host.
      - "host.docker.internal:host-gateway"

  grafana:
    build: ./grafana
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=true    # View the dashboard without a separate login form.
