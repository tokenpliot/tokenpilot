import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.util.jar.JarFile

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.jreleaser' version '1.24.0'
}

def publishedModuleDescriptions = [
    'token-pilot-core': 'Framework-independent LLM usage normalization, pricing, cost calculation, and ledger contracts.',
    'token-pilot-spring-ai': 'Optional Spring AI adapter for recording provider-reported LLM usage through Token Pilot.',
    'token-pilot-micrometer': 'Optional Micrometer publishers for Token Pilot control, cost, budget, reconciliation, and notification events.',
    'token-pilot-budget': 'Budget policy evaluation and in-memory budget state components for Token Pilot.',
    'token-pilot-notification': 'Budget notification events, handlers, and deduplication components for Token Pilot.',
    'token-pilot-autoconfigure': 'Spring Boot auto-configuration for Token Pilot core and optional adapters.',
    'token-pilot-starter': 'Spring AI convenience starter that assembles Token Pilot runtime modules.'
]

def compatibilityMatrix = [
    java: 25,
    springBoot: '4.1.0',
    springAi: '2.0.0',
    junit: '6.0.3',
    assertj: '3.27.7',
    mockito: '5.23.0'
]

def springManagedModules = [
    'token-pilot-autoconfigure',
    'token-pilot-starter',
    'token-pilot-sample-app'
] as Set

allprojects {
    group = 'cloud.token-pilot'
    version = providers.gradleProperty('projectVersion').orElse('0.0.1-SNAPSHOT').get()

    repositories {
        mavenCentral()
    }
}

jreleaser {
    def signingPublicKeyFile = providers.gradleProperty('signingPublicKeyFile')
        .orElse(providers.environmentVariable('SIGNING_PUBLIC_KEY_FILE'))
        .orNull
    def signingSecretKeyFile = providers.gradleProperty('signingKeyFile')
        .orElse(providers.environmentVariable('SIGNING_KEY_FILE'))
        .orNull
    def signingPassphrase = providers.gradleProperty('signingPassword')
        .orElse(providers.environmentVariable('SIGNING_PASSWORD'))
        .orNull
    def centralUsername = providers.gradleProperty('centralUsername')
        .orElse(providers.environmentVariable('CENTRAL_USERNAME'))
        .orNull
    def centralPassword = providers.gradleProperty('centralPassword')
        .orElse(providers.environmentVariable('CENTRAL_PASSWORD'))
        .orNull

    gitRootSearch = true

    project {
        copyright = '2026 Token Pilot'
        authors = ['Token Pilot']
        description = 'Framework-independent Java LLM usage control and accounting core with optional adapters.'
        inceptionYear = '2026'
        license = 'MIT'
        languages {
            java {
                version = compatibilityMatrix.java.toString()
            }
        }
        links {
            homepage = 'https://github.com/tokenpliot/tokenpilot'
        }
    }

    def githubToken = providers.gradleProperty('githubToken')
        .orElse(providers.environmentVariable('GITHUB_TOKEN'))
        .orNull

    release {
        github {
            enabled = true
            repoOwner = 'tokenpliot'
            name = 'tokenpilot'
            skipTag = true
            skipRelease = true

            if (githubToken) {
                token = githubToken
            }
        }
    }

    signing {
        pgp {
            active = 'RELEASE'
            armored = true

            if (signingPublicKeyFile && signingSecretKeyFile) {
                mode = 'FILE'
                publicKey = signingPublicKeyFile
                secretKey = signingSecretKeyFile
            }

            if (signingPassphrase) {
                passphrase = signingPassphrase
            }
        }
    }

    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    namespace = 'cloud.token-pilot'
                    [
                        'token-pilot-core',
                        'token-pilot-spring-ai',
                        'token-pilot-micrometer',
                        'token-pilot-budget',
                        'token-pilot-notification',
                        'token-pilot-autoconfigure',
                        'token-pilot-starter'
                    ].each { moduleName ->
                        stagingRepository("${moduleName}/build/staging-deploy")
                    }

                    if (centralUsername) {
                        username = centralUsername
                    }

                    if (centralPassword) {
                        password = centralPassword
                    }
                }
            }
        }
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(compatibilityMatrix.java)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = compatibilityMatrix.java
    }

    if (springManagedModules.contains(name)) {
        apply plugin: 'io.spring.dependency-management'

        dependencyManagement {
            imports {
                mavenBom "org.springframework.boot:spring-boot-dependencies:${compatibilityMatrix.springBoot}"
                mavenBom "org.springframework.ai:spring-ai-bom:${compatibilityMatrix.springAi}"
            }
        }
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${compatibilityMatrix.junit}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation "org.assertj:assertj-core:${compatibilityMatrix.assertj}"
        testImplementation "org.mockito:mockito-core:${compatibilityMatrix.mockito}"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    if (name != 'token-pilot-sample-app') {
        description = publishedModuleDescriptions[name]
        if (!description) {
            throw new GradleException("Missing publication description for ${project.path}")
        }

        apply plugin: 'maven-publish'
        apply plugin: 'signing'

        java {
            withSourcesJar()
            withJavadocJar()
        }

        def signingKeyFile = providers.gradleProperty('signingKeyFile')
            .orElse(providers.environmentVariable('SIGNING_KEY_FILE'))
            .orNull
        def signingKey = providers.gradleProperty('signingKey')
            .orElse(providers.environmentVariable('SIGNING_KEY'))
            .orNull
        def signingPassword = providers.gradleProperty('signingPassword')
            .orElse(providers.environmentVariable('SIGNING_PASSWORD'))
            .orNull

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java

                    pom {
                        name = project.name
                        description = publishedModuleDescriptions[project.name]
                        url = 'https://github.com/tokenpliot/tokenpilot'
                        inceptionYear = '2026'

                        organization {
                            name = 'Token Pilot'
                            url = 'https://github.com/tokenpliot'
                        }

                        licenses {
                            license {
                                name = 'MIT License'
                                url = 'https://opensource.org/license/mit'
                                distribution = 'repo'
                            }
                        }

                        developers {
                            developer {
                                id = 'tokenpliot'
                                name = 'Token Pilot'
                                url = 'https://github.com/tokenpliot'
                            }
                        }

                        issueManagement {
                            system = 'GitHub Issues'
                            url = 'https://github.com/tokenpliot/tokenpilot/issues'
                        }

                        ciManagement {
                            system = 'GitHub Actions'
                            url = 'https://github.com/tokenpliot/tokenpilot/actions'
                        }

                        scm {
                            connection = 'scm:git:https://github.com/tokenpliot/tokenpilot.git'
                            developerConnection = 'scm:git:ssh://git@github.com/tokenpliot/tokenpilot.git'
                            url = 'https://github.com/tokenpliot/tokenpilot'
                            tag = 'HEAD'
                        }
                    }
                }
            }

            repositories {
                mavenLocal()

                maven {
                    name = 'staging'
                    url = layout.buildDirectory.dir('staging-deploy')
                }

                def mavenRepoUrl = providers.gradleProperty('mavenRepoUrl').orNull
                def mavenRepoUsername = providers.gradleProperty('mavenRepoUsername')
                    .orElse(providers.environmentVariable('MAVEN_REPO_USERNAME'))
                    .orNull
                def mavenRepoPassword = providers.gradleProperty('mavenRepoPassword')
                    .orElse(providers.environmentVariable('MAVEN_REPO_PASSWORD'))
                    .orNull

                if (mavenRepoUrl && mavenRepoUsername && mavenRepoPassword) {
                    maven {
                        name = 'remote'
                        url = uri(mavenRepoUrl)
                        credentials {
                            username = mavenRepoUsername
                            password = mavenRepoPassword
                        }
                    }
                }
            }
        }

        signing {
            required {
                !project.version.toString().endsWith('-SNAPSHOT')
            }

            if (signingKeyFile && signingPassword) {
                useInMemoryPgpKeys(file(signingKeyFile).text, signingPassword)
            } else if (signingKey && signingPassword) {
                useInMemoryPgpKeys(signingKey, signingPassword)
            }

            sign publishing.publications.mavenJava
        }
    }
}

def stagingPublicationTasks = publishedModuleDescriptions.keySet().collect {
    ":${it}:publishAllPublicationsToStagingRepository"
}

tasks.register('publishAllPublicationsToStagingRepository') {
    group = 'publishing'
    description = 'Publishes every public Token Pilot module to its module-local staging repository.'
    dependsOn stagingPublicationTasks
}

tasks.register('verifyReleaseCandidate') {
    group = 'verification'
    description = 'Runs release checks, stages every public module, and verifies the complete artifact set.'
    dependsOn subprojects.collect { "${it.path}:test" }
    dependsOn tasks.named('check')
    dependsOn tasks.named('publishAllPublicationsToStagingRepository')

    doLast {
        def version = project.version.toString()
        def requiredArtifacts = [
            'binary JAR': { String name ->
                name.endsWith('.jar') &&
                    !name.endsWith('-sources.jar') &&
                    !name.endsWith('-javadoc.jar')
            },
            'sources JAR': { String name -> name.endsWith('-sources.jar') },
            'Javadoc JAR': { String name -> name.endsWith('-javadoc.jar') },
            'POM': { String name -> name.endsWith('.pom') },
            'Gradle module metadata': { String name -> name.endsWith('.module') }
        ]
        def requiredSignatures = [
            'binary JAR signature': { String name ->
                name.endsWith('.jar.asc') &&
                    !name.endsWith('-sources.jar.asc') &&
                    !name.endsWith('-javadoc.jar.asc')
            },
            'sources JAR signature': { String name -> name.endsWith('-sources.jar.asc') },
            'Javadoc JAR signature': { String name -> name.endsWith('-javadoc.jar.asc') },
            'POM signature': { String name -> name.endsWith('.pom.asc') },
            'Gradle module metadata signature': { String name -> name.endsWith('.module.asc') }
        ]

        publishedModuleDescriptions.keySet().each { moduleName ->
            def moduleProject = project(":${moduleName}")
            def versionDirectory = moduleProject.file(
                "build/staging-deploy/cloud/token-pilot/${moduleName}/${version}"
            )
            if (!versionDirectory.isDirectory()) {
                throw new GradleException(
                    "${moduleName} staging directory is missing for version ${version}: ${versionDirectory}"
                )
            }

            def artifactNames = versionDirectory.listFiles()
                ?.findAll { it.isFile() }
                ?.collect { it.name } ?: []
            def missingArtifacts = requiredArtifacts.findAll { label, matcher ->
                !artifactNames.any { artifactName -> matcher(artifactName) }
            }.keySet()
            if (!missingArtifacts.isEmpty()) {
                throw new GradleException(
                    "${moduleName}:${version} is missing published artifacts: ${missingArtifacts}"
                )
            }

            if (!version.endsWith('-SNAPSHOT')) {
                def missingSignatures = requiredSignatures.findAll { label, matcher ->
                    !artifactNames.any { artifactName -> matcher(artifactName) }
                }.keySet()
                if (!missingSignatures.isEmpty()) {
                    throw new GradleException(
                        "${moduleName}:${version} is missing release signatures: ${missingSignatures}"
                    )
                }
            }
        }

        println "Verified ${publishedModuleDescriptions.size()} Token Pilot release candidates at ${version}."
    }
}

def publicationPomTasks = publishedModuleDescriptions.keySet().collect {
    ":${it}:generatePomFileForMavenJavaPublication"
}

tasks.register('verifyPublicationMetadata') {
    group = 'verification'
    description = 'Verifies generated Maven POM metadata for every published Token Pilot module.'
    dependsOn publicationPomTasks
    dependsOn ':token-pilot-spring-ai:generateMetadataFileForMavenJavaPublication'
    inputs.file(layout.projectDirectory.file('LICENSE'))

    doLast {
        def expectedPublishedModules = publishedModuleDescriptions.keySet() as Set
        def actualPublishedModules = subprojects
            .findAll { it.plugins.hasPlugin('maven-publish') }
            .collect { it.name } as Set

        if (actualPublishedModules != expectedPublishedModules) {
            throw new GradleException(
                "Published modules differ from the expected set. Expected ${expectedPublishedModules}, actual ${actualPublishedModules}"
            )
        }

        if (file('LICENSE').readLines('UTF-8').first().trim() != 'MIT License') {
            throw new GradleException('Root LICENSE must use the MIT License.')
        }

        def requirePomValue = { String moduleName, String field, String actual, String expected ->
            if (actual != expected) {
                throw new GradleException(
                    "${moduleName} POM ${field} must be '${expected}', but was '${actual}'."
                )
            }
        }

        publishedModuleDescriptions.each { moduleName, moduleDescription ->
            def moduleProject = project(":${moduleName}")
            def pomFile = moduleProject.layout.buildDirectory
                .file('publications/mavenJava/pom-default.xml')
                .get()
                .asFile
            def pom = new XmlSlurper(false, false).parse(pomFile)

            requirePomValue(moduleName, 'version', pom.version.text(), project.version.toString())
            requirePomValue(moduleName, 'name', pom.name.text(), moduleName)
            requirePomValue(moduleName, 'description', pom.description.text(), moduleDescription)
            requirePomValue(moduleName, 'url', pom.url.text(), 'https://github.com/tokenpliot/tokenpilot')
            requirePomValue(moduleName, 'license name', pom.licenses.license.name.text(), 'MIT License')
            requirePomValue(moduleName, 'license URL', pom.licenses.license.url.text(), 'https://opensource.org/license/mit')
            requirePomValue(moduleName, 'license distribution', pom.licenses.license.distribution.text(), 'repo')
            requirePomValue(moduleName, 'organization name', pom.organization.name.text(), 'Token Pilot')
            requirePomValue(moduleName, 'organization URL', pom.organization.url.text(), 'https://github.com/tokenpliot')
            requirePomValue(moduleName, 'developer id', pom.developers.developer.id.text(), 'tokenpliot')
            requirePomValue(moduleName, 'developer name', pom.developers.developer.name.text(), 'Token Pilot')
            requirePomValue(moduleName, 'developer URL', pom.developers.developer.url.text(), 'https://github.com/tokenpliot')
            requirePomValue(
                moduleName,
                'SCM connection',
                pom.scm.connection.text(),
                'scm:git:https://github.com/tokenpliot/tokenpilot.git'
            )
            requirePomValue(
                moduleName,
                'SCM developer connection',
                pom.scm.developerConnection.text(),
                'scm:git:ssh://git@github.com/tokenpliot/tokenpilot.git'
            )
            requirePomValue(moduleName, 'SCM URL', pom.scm.url.text(), 'https://github.com/tokenpliot/tokenpilot')
        }

        def micrometerPomFile = project(':token-pilot-micrometer')
            .layout.buildDirectory
            .file('publications/mavenJava/pom-default.xml')
            .get()
            .asFile
        def micrometerPom = new XmlSlurper(false, false).parse(micrometerPomFile)
        def micrometerDependencies = micrometerPom.dependencies.dependency.collect {
            "${it.groupId.text()}:${it.artifactId.text()}:${it.scope.text()}".toString()
        } as Set
        if (!micrometerDependencies.contains(
            'cloud.token-pilot:token-pilot-core:compile'
        ) || !micrometerDependencies.contains(
            'io.micrometer:micrometer-core:compile'
        )) {
            throw new GradleException(
                'token-pilot-micrometer POM must expose core and micrometer-core as compile dependencies.'
            )
        }
        def forbiddenMicrometerOwners = micrometerPom.dependencies.dependency.findAll {
            it.groupId.text() == 'cloud.token-pilot' &&
                it.artifactId.text() in [
                    'token-pilot-budget',
                    'token-pilot-notification'
                ]
        }
        if (!forbiddenMicrometerOwners.isEmpty()) {
            throw new GradleException(
                'token-pilot-micrometer POM must keep budget and notification owners optional.'
            )
        }

        def springAiPomFile = project(':token-pilot-spring-ai')
            .layout.buildDirectory
            .file('publications/mavenJava/pom-default.xml')
            .get()
            .asFile
        def springAiPom = new XmlSlurper(false, false).parse(springAiPomFile)
        def springAiDependencies = springAiPom.dependencies.dependency.collect {
            "${it.groupId.text()}:${it.artifactId.text()}:${it.scope.text()}".toString()
        } as Set
        def expectedSpringAiDependencies = [
            'cloud.token-pilot:token-pilot-core:compile',
            'cloud.token-pilot:token-pilot-budget:compile',
            'org.springframework.ai:spring-ai-model:compile',
            'org.springframework.ai:spring-ai-client-chat:compile',
            'io.projectreactor:reactor-core:compile'
        ] as Set
        if (springAiDependencies != expectedSpringAiDependencies) {
            throw new GradleException(
                'token-pilot-spring-ai POM must expose every public ABI dependency at compile scope. ' +
                    "Expected ${expectedSpringAiDependencies}, actual ${springAiDependencies}."
            )
        }
        def springAiManagedDependencies = springAiPom.dependencyManagement.dependencies.dependency.collect {
            "${it.groupId.text()}:${it.artifactId.text()}:${it.version.text()}:${it.type.text()}:${it.scope.text()}".toString()
        }
        def expectedSpringAiManagedDependencies = [
            'org.springframework.boot:spring-boot-dependencies:4.1.0:pom:import',
            'org.springframework.ai:spring-ai-bom:2.0.0:pom:import'
        ] as Set
        if (springAiManagedDependencies.size() != 2 ||
            (springAiManagedDependencies as Set) != expectedSpringAiManagedDependencies) {
            throw new GradleException(
                'token-pilot-spring-ai POM must import each supported BOM exactly once. ' +
                    "Expected ${expectedSpringAiManagedDependencies}, actual ${springAiManagedDependencies}."
            )
        }

        def springAiModuleFile = project(':token-pilot-spring-ai')
            .layout.buildDirectory
            .file('publications/mavenJava/module.json')
            .get()
            .asFile
        def springAiModule = new JsonSlurper().parse(springAiModuleFile)
        def expectedSpringAiVariantDependencies = [
            'org.springframework.boot:spring-boot-dependencies',
            'org.springframework.ai:spring-ai-bom',
            'cloud.token-pilot:token-pilot-core',
            'cloud.token-pilot:token-pilot-budget',
            'org.springframework.ai:spring-ai-model',
            'org.springframework.ai:spring-ai-client-chat',
            'io.projectreactor:reactor-core'
        ] as Set
        [
            apiElements: 'java-api',
            runtimeElements: 'java-runtime'
        ].each { variantName, usage ->
            def variant = springAiModule.variants.find { it.name == variantName }
            if (variant == null || variant.attributes['org.gradle.usage'] != usage) {
                throw new GradleException(
                    "token-pilot-spring-ai module metadata is missing ${variantName}."
                )
            }
            def variantDependencies = variant.dependencies.collect {
                "${it.group}:${it.module}".toString()
            } as Set
            if (variantDependencies != expectedSpringAiVariantDependencies) {
                throw new GradleException(
                    "token-pilot-spring-ai ${variantName} dependencies differ. " +
                        "Expected ${expectedSpringAiVariantDependencies}, actual ${variantDependencies}."
                )
            }
            def bootPlatform = variant.dependencies.find {
                it.group == 'org.springframework.boot' &&
                    it.module == 'spring-boot-dependencies'
            }
            def springAiPlatform = variant.dependencies.find {
                it.group == 'org.springframework.ai' && it.module == 'spring-ai-bom'
            }
            if (bootPlatform?.version?.requires != compatibilityMatrix.springBoot ||
                bootPlatform?.attributes?.get('org.gradle.category') != 'platform' ||
                springAiPlatform?.version?.requires != compatibilityMatrix.springAi ||
                springAiPlatform?.attributes?.get('org.gradle.category') != 'platform') {
                throw new GradleException(
                    "token-pilot-spring-ai ${variantName} must carry the supported Boot and Spring AI platforms."
                )
            }
        }

        def starterPomFile = project(':token-pilot-starter')
            .layout.buildDirectory
            .file('publications/mavenJava/pom-default.xml')
            .get()
            .asFile
        def starterPom = new XmlSlurper(false, false).parse(starterPomFile)
        def starterDependencies = starterPom.dependencies.dependency.collect {
            "${it.groupId.text()}:${it.artifactId.text()}:${it.scope.text()}".toString()
        } as Set
        def expectedStarterDependencies = [
            'cloud.token-pilot:token-pilot-core:compile',
            'cloud.token-pilot:token-pilot-spring-ai:compile',
            'cloud.token-pilot:token-pilot-micrometer:compile',
            'cloud.token-pilot:token-pilot-budget:compile',
            'cloud.token-pilot:token-pilot-notification:compile',
            'cloud.token-pilot:token-pilot-autoconfigure:compile'
        ] as Set
        if (starterDependencies != expectedStarterDependencies) {
            throw new GradleException(
                'token-pilot-starter POM must expose only the Token Pilot runtime graph at compile scope; ' +
                    'applications select their Spring AI provider separately. ' +
                    "Expected ${expectedStarterDependencies}, actual ${starterDependencies}."
            )
        }
    }
}

tasks.register('verifyCompatibilityMatrix') {
    group = 'verification'
    description = 'Verifies the Java 25, Spring Boot 4.1.0, and Spring AI 2.0.0 compatibility baseline.'
    dependsOn tasks.named('verifyPublicationMetadata')
    dependsOn ':token-pilot-core:classes'
    dependsOn ':token-pilot-core:generateMetadataFileForMavenJavaPublication'

    doLast {
        def expectedJavaVersion = compatibilityMatrix.java as Integer
        def expectedClassMajorVersion = expectedJavaVersion + 44

        subprojects.each { moduleProject ->
            moduleProject.tasks.withType(JavaCompile).each { compileTask ->
                def configuredRelease = compileTask.options.release.orNull
                if (configuredRelease != expectedJavaVersion) {
                    throw new GradleException(
                        "${compileTask.path} must compile with --release ${expectedJavaVersion}, but was ${configuredRelease}."
                    )
                }
            }
        }

        def coreProject = project(':token-pilot-core')
        def corePomFile = coreProject.layout.buildDirectory
            .file('publications/mavenJava/pom-default.xml')
            .get()
            .asFile
        def corePom = new XmlSlurper(false, false).parse(corePomFile)
        def forbiddenGroups = [
            'org.springframework',
            'org.springframework.ai',
            'io.micrometer',
            'io.projectreactor'
        ]
        def forbiddenPomDependencies = corePom.depthFirst().findAll { node ->
            node.name() == 'dependency' && forbiddenGroups.any {
                node.groupId.text() == it || node.groupId.text().startsWith("${it}.")
            }
        }

        if (!forbiddenPomDependencies.isEmpty()) {
            throw new GradleException(
                "token-pilot-core POM must not expose Spring, Spring AI, Micrometer, or Reactor dependencies."
            )
        }

        if (corePom.dependencyManagement.size() != 0) {
            throw new GradleException('token-pilot-core POM must not import a dependency-management BOM.')
        }

        def coreModuleFile = coreProject.layout.buildDirectory
            .file('publications/mavenJava/module.json')
            .get()
            .asFile
        def coreModule = new JsonSlurper().parse(coreModuleFile)
        def publishedVariants = coreModule.variants.findAll {
            it.name == 'apiElements' || it.name == 'runtimeElements'
        }

        if (publishedVariants.size() != 2) {
            throw new GradleException('token-pilot-core module metadata must publish API and runtime variants.')
        }

        publishedVariants.each { variant ->
            def publishedJavaVersion = variant.attributes['org.gradle.jvm.version']
            if (publishedJavaVersion != expectedJavaVersion) {
                throw new GradleException(
                    "token-pilot-core ${variant.name} must target Java ${expectedJavaVersion}, but was ${publishedJavaVersion}."
                )
            }

            def forbiddenModuleDependencies = (variant.dependencies ?: []).findAll { dependency ->
                forbiddenGroups.any {
                    dependency.group == it || dependency.group?.startsWith("${it}.")
                }
            }
            def forbiddenModuleConstraints = (variant.dependencyConstraints ?: []).findAll { dependency ->
                forbiddenGroups.any {
                    dependency.group == it || dependency.group?.startsWith("${it}.")
                }
            }

            if (!forbiddenModuleDependencies.isEmpty() || !forbiddenModuleConstraints.isEmpty()) {
                throw new GradleException(
                    "token-pilot-core ${variant.name} must not expose Spring, Spring AI, Micrometer, or Reactor metadata."
                )
            }
        }

        def coreClassFiles = coreProject.fileTree(
            coreProject.layout.buildDirectory.dir('classes/java/main')
        ) {
            include '**/*.class'
        }.files

        if (coreClassFiles.isEmpty()) {
            throw new GradleException('No token-pilot-core class files were found for bytecode verification.')
        }

        coreClassFiles.each { classFile ->
            classFile.withDataInputStream { stream ->
                stream.skipBytes(6)
                def majorVersion = stream.readUnsignedShort()
                if (majorVersion != expectedClassMajorVersion) {
                    throw new GradleException(
                        "${classFile.name} must use Java ${expectedJavaVersion} class version " +
                            "${expectedClassMajorVersion}, but was ${majorVersion}."
                    )
                }
            }
        }

        def resolvedVersions = [:]
        project(':token-pilot-sample-app')
            .configurations
            .runtimeClasspath
            .incoming
            .resolutionResult
            .allComponents
            .each { component ->
                if (component.id instanceof ModuleComponentIdentifier) {
                    resolvedVersions["${component.id.group}:${component.id.module}"] = component.id.version
                }
            }

        def requiredVersions = [
            'org.springframework.boot:spring-boot': compatibilityMatrix.springBoot,
            'org.springframework.ai:spring-ai-model': compatibilityMatrix.springAi,
            'org.springframework.ai:spring-ai-client-chat': compatibilityMatrix.springAi
        ]

        requiredVersions.each { coordinate, expectedVersion ->
            def actualVersion = resolvedVersions[coordinate]
            if (actualVersion != expectedVersion) {
                throw new GradleException(
                    "${coordinate} must resolve to ${expectedVersion}, but was ${actualVersion}."
                )
            }
        }

        def unsupportedSpringAiVersions = resolvedVersions.findAll { coordinate, version ->
            coordinate.startsWith('org.springframework.ai:') && version != compatibilityMatrix.springAi
        }
        if (!unsupportedSpringAiVersions.isEmpty()) {
            throw new GradleException(
                "All Spring AI modules must resolve to ${compatibilityMatrix.springAi}: ${unsupportedSpringAiVersions}"
            )
        }

        def unsupportedSpringBootVersions = resolvedVersions.findAll { coordinate, version ->
            coordinate.startsWith('org.springframework.boot:') && version != compatibilityMatrix.springBoot
        }
        if (!unsupportedSpringBootVersions.isEmpty()) {
            throw new GradleException(
                "All Spring Boot modules must resolve to ${compatibilityMatrix.springBoot}: ${unsupportedSpringBootVersions}"
            )
        }

        def springAiClassOwners = [:].withDefault { [] }
        project(':token-pilot-sample-app')
            .configurations
            .runtimeClasspath
            .incoming
            .artifacts
            .artifacts
            .findAll {
                it.id.componentIdentifier instanceof ModuleComponentIdentifier &&
                    it.file.name.endsWith('.jar')
            }
            .each { artifact ->
                new JarFile(artifact.file).withCloseable { jar ->
                    jar.entries().findAll { entry ->
                        !entry.directory &&
                            entry.name.startsWith('org/springframework/ai/') &&
                            entry.name.endsWith('.class') &&
                            !entry.name.endsWith('/module-info.class') &&
                            !entry.name.endsWith('/package-info.class')
                    }.each { entry ->
                        springAiClassOwners[entry.name] << artifact.file.name
                    }
                }
            }

        def duplicateSpringAiClasses = springAiClassOwners.findAll { className, owners ->
            owners.size() > 1
        }
        if (!duplicateSpringAiClasses.isEmpty()) {
            throw new GradleException(
                "Duplicate Spring AI classes were found on the starter runtime classpath: ${duplicateSpringAiClasses}"
            )
        }
    }
}

