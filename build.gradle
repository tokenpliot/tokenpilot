import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import java.util.jar.JarFile

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'org.jreleaser' version '1.24.0'
}

def publishedModuleDescriptions = [
    'token-pilot-core': 'Framework-independent LLM usage normalization, pricing, cost calculation, and ledger contracts.',
    'token-pilot-spring-ai': 'Optional Spring AI adapter for recording provider-reported LLM usage through Token Pilot.',
    'token-pilot-micrometer': 'Optional Micrometer publishers for Token Pilot control, cost, budget, reconciliation, and notification events.',
    'token-pilot-budget': 'Budget policy evaluation and in-memory budget state components for Token Pilot.',
    'token-pilot-notification': 'Budget notification events, handlers, and deduplication components for Token Pilot.',
    'token-pilot-autoconfigure': 'Spring Boot auto-configuration for Token Pilot core and optional adapters.',
    'token-pilot-starter': 'Spring AI convenience starter that assembles Token Pilot runtime modules.'
]

def compatibilityMatrix = [
    java: 25,
    springBoot: '4.1.0',
    springAi: '2.0.0',
    junit: '6.0.3',
    assertj: '3.27.7',
    mockito: '5.23.0'
]

def springManagedModules = [
    'token-pilot-spring-ai',
    'token-pilot-autoconfigure',
    'token-pilot-starter',
    'token-pilot-sample-app'
] as Set

allprojects {
    group = 'cloud.token-pilot'
    version = providers.gradleProperty('projectVersion').orElse('0.0.1-SNAPSHOT').get()

    repositories {
        mavenCentral()
    }
}

jreleaser {
    def signingPublicKeyFile = providers.gradleProperty('signingPublicKeyFile')
        .orElse(providers.environmentVariable('SIGNING_PUBLIC_KEY_FILE'))
        .orNull
    def signingSecretKeyFile = providers.gradleProperty('signingKeyFile')
        .orElse(providers.environmentVariable('SIGNING_KEY_FILE'))
        .orNull
    def signingPassphrase = providers.gradleProperty('signingPassword')
        .orElse(providers.environmentVariable('SIGNING_PASSWORD'))
        .orNull
    def centralUsername = providers.gradleProperty('centralUsername')
        .orElse(providers.environmentVariable('CENTRAL_USERNAME'))
        .orNull
    def centralPassword = providers.gradleProperty('centralPassword')
        .orElse(providers.environmentVariable('CENTRAL_PASSWORD'))
        .orNull

    gitRootSearch = true

    project {
        copyright = '2026 Token Pilot'
        authors = ['Token Pilot']
        description = 'Framework-independent Java LLM usage control and accounting core with optional adapters.'
        inceptionYear = '2026'
        license = 'MIT'
        languages {
            java {
                version = compatibilityMatrix.java.toString()
            }
        }
        links {
            homepage = 'https://github.com/tokenpliot/tokenpilot'
        }
    }

    def githubToken = providers.gradleProperty('githubToken')
        .orElse(providers.environmentVariable('GITHUB_TOKEN'))
        .orNull

    release {
        github {
            enabled = true
            repoOwner = 'tokenpliot'
            name = 'tokenpilot'
            skipTag = true
            skipRelease = true

            if (githubToken) {
                token = githubToken
            }
        }
    }

    signing {
        pgp {
            active = 'RELEASE'
            armored = true

            if (signingPublicKeyFile && signingSecretKeyFile) {
                mode = 'FILE'
                publicKey = signingPublicKeyFile
                secretKey = signingSecretKeyFile
            }

            if (signingPassphrase) {
                passphrase = signingPassphrase
            }
        }
    }

    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'RELEASE'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    namespace = 'cloud.token-pilot'
                    [
                        'token-pilot-core',
                        'token-pilot-spring-ai',
                        'token-pilot-micrometer',
                        'token-pilot-budget',
                        'token-pilot-notification',
                        'token-pilot-autoconfigure',
                        'token-pilot-starter'
                    ].each { moduleName ->
                        stagingRepository("${moduleName}/build/staging-deploy")
                    }

                    if (centralUsername) {
                        username = centralUsername
                    }

                    if (centralPassword) {
                        password = centralPassword
                    }
                }
            }
        }
    }
}

subprojects {
    apply plugin: 'java-library'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(compatibilityMatrix.java)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = compatibilityMatrix.java
    }

    if (springManagedModules.contains(name)) {
        apply plugin: 'io.spring.dependency-management'

        dependencyManagement {
            imports {
                mavenBom "org.springframework.boot:spring-boot-dependencies:${compatibilityMatrix.springBoot}"
                mavenBom "org.springframework.ai:spring-ai-bom:${compatibilityMatrix.springAi}"
            }
        }
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${compatibilityMatrix.junit}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation "org.assertj:assertj-core:${compatibilityMatrix.assertj}"
        testImplementation "org.mockito:mockito-core:${compatibilityMatrix.mockito}"
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    if (name != 'token-pilot-sample-app') {
        description = publishedModuleDescriptions[name]
        if (!description) {
            throw new GradleException("Missing publication description for ${project.path}")
        }

        apply plugin: 'maven-publish'
        apply plugin: 'signing'

        java {
            withSourcesJar()
            withJavadocJar()
        }

        def signingKeyFile = providers.gradleProperty('signingKeyFile')
            .orElse(providers.environmentVariable('SIGNING_KEY_FILE'))
            .orNull
        def signingKey = providers.gradleProperty('signingKey')
            .orElse(providers.environmentVariable('SIGNING_KEY'))
            .orNull
        def signingPassword = providers.gradleProperty('signingPassword')
            .orElse(providers.environmentVariable('SIGNING_PASSWORD'))
            .orNull

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    from components.java

                    pom {
                        name = project.name
                        description = publishedModuleDescriptions[project.name]
                        url = 'https://github.com/tokenpliot/tokenpilot'
                        inceptionYear = '2026'

                        organization {
                            name = 'Token Pilot'
                            url = 'https://github.com/tokenpliot'
                        }

                        licenses {
                            license {
                                name = 'MIT License'
                                url = 'https://opensource.org/license/mit'
                                distribution = 'repo'
                            }
                        }

                        developers {
                            developer {
                                id = 'tokenpliot'
                                name = 'Token Pilot'
                                url = 'https://github.com/tokenpliot'
                            }
                        }

                        issueManagement {
                            system = 'GitHub Issues'
                            url = 'https://github.com/tokenpliot/tokenpilot/issues'
                        }

                        ciManagement {
                            system = 'GitHub Actions'
                            url = 'https://github.com/tokenpliot/tokenpilot/actions'
                        }

                        scm {
                            connection = 'scm:git:https://github.com/tokenpliot/tokenpilot.git'
                            developerConnection = 'scm:git:ssh://git@github.com/tokenpliot/tokenpilot.git'
                            url = 'https://github.com/tokenpliot/tokenpilot'
                            tag = 'HEAD'
                        }
                    }
                }
            }

            repositories {
                mavenLocal()

                maven {
                    name = 'staging'
                    url = layout.buildDirectory.dir('staging-deploy')
                }

                def mavenRepoUrl = providers.gradleProperty('mavenRepoUrl').orNull
                def mavenRepoUsername = providers.gradleProperty('mavenRepoUsername')
                    .orElse(providers.environmentVariable('MAVEN_REPO_USERNAME'))
                    .orNull
                def mavenRepoPassword = providers.gradleProperty('mavenRepoPassword')
                    .orElse(providers.environmentVariable('MAVEN_REPO_PASSWORD'))
                    .orNull

                if (mavenRepoUrl && mavenRepoUsername && mavenRepoPassword) {
                    maven {
                        name = 'remote'
                        url = uri(mavenRepoUrl)
                        credentials {
                            username = mavenRepoUsername
                            password = mavenRepoPassword
                        }
                    }
                }
            }
        }

        signing {
            required {
                !project.version.toString().endsWith('-SNAPSHOT')
            }

            if (signingKeyFile && signingPassword) {
                useInMemoryPgpKeys(file(signingKeyFile).text, signingPassword)
            } else if (signingKey && signingPassword) {
                useInMemoryPgpKeys(signingKey, signingPassword)
            }

            sign publishing.publications.mavenJava
        }
    }
}

def publicationPomTasks = publishedModuleDescriptions.keySet().collect {
    ":${it}:generatePomFileForMavenJavaPublication"
}

tasks.register('verifyPublicationMetadata') {
    group = 'verification'
    description = 'Verifies generated Maven POM metadata for every published Token Pilot module.'
    dependsOn publicationPomTasks
    inputs.file(layout.projectDirectory.file('LICENSE'))

    doLast {
        def expectedPublishedModules = publishedModuleDescriptions.keySet() as Set
        def actualPublishedModules = subprojects
            .findAll { it.plugins.hasPlugin('maven-publish') }
            .collect { it.name } as Set

        if (actualPublishedModules != expectedPublishedModules) {
            throw new GradleException(
                "Published modules differ from the expected set. Expected ${expectedPublishedModules}, actual ${actualPublishedModules}"
            )
        }

        if (file('LICENSE').readLines('UTF-8').first().trim() != 'MIT License') {
            throw new GradleException('Root LICENSE must use the MIT License.')
        }

        def requirePomValue = { String moduleName, String field, String actual, String expected ->
            if (actual != expected) {
                throw new GradleException(
                    "${moduleName} POM ${field} must be '${expected}', but was '${actual}'."
                )
            }
        }

        publishedModuleDescriptions.each { moduleName, moduleDescription ->
            def moduleProject = project(":${moduleName}")
            def pomFile = moduleProject.layout.buildDirectory
                .file('publications/mavenJava/pom-default.xml')
                .get()
                .asFile
            def pom = new XmlSlurper(false, false).parse(pomFile)

            requirePomValue(moduleName, 'name', pom.name.text(), moduleName)
            requirePomValue(moduleName, 'description', pom.description.text(), moduleDescription)
            requirePomValue(moduleName, 'url', pom.url.text(), 'https://github.com/tokenpliot/tokenpilot')
            requirePomValue(moduleName, 'license name', pom.licenses.license.name.text(), 'MIT License')
            requirePomValue(moduleName, 'license URL', pom.licenses.license.url.text(), 'https://opensource.org/license/mit')
            requirePomValue(moduleName, 'license distribution', pom.licenses.license.distribution.text(), 'repo')
            requirePomValue(moduleName, 'organization name', pom.organization.name.text(), 'Token Pilot')
            requirePomValue(moduleName, 'organization URL', pom.organization.url.text(), 'https://github.com/tokenpliot')
            requirePomValue(moduleName, 'developer id', pom.developers.developer.id.text(), 'tokenpliot')
            requirePomValue(moduleName, 'developer name', pom.developers.developer.name.text(), 'Token Pilot')
            requirePomValue(moduleName, 'developer URL', pom.developers.developer.url.text(), 'https://github.com/tokenpliot')
            requirePomValue(
                moduleName,
                'SCM connection',
                pom.scm.connection.text(),
                'scm:git:https://github.com/tokenpliot/tokenpilot.git'
            )
            requirePomValue(
                moduleName,
                'SCM developer connection',
                pom.scm.developerConnection.text(),
                'scm:git:ssh://git@github.com/tokenpliot/tokenpilot.git'
            )
            requirePomValue(moduleName, 'SCM URL', pom.scm.url.text(), 'https://github.com/tokenpliot/tokenpilot')
        }

        def micrometerPomFile = project(':token-pilot-micrometer')
            .layout.buildDirectory
            .file('publications/mavenJava/pom-default.xml')
            .get()
            .asFile
        def micrometerPom = new XmlSlurper(false, false).parse(micrometerPomFile)
        def micrometerDependencies = micrometerPom.dependencies.dependency.collect {
            "${it.groupId.text()}:${it.artifactId.text()}:${it.scope.text()}".toString()
        } as Set
        if (!micrometerDependencies.contains(
            'cloud.token-pilot:token-pilot-core:compile'
        ) || !micrometerDependencies.contains(
            'io.micrometer:micrometer-core:compile'
        )) {
            throw new GradleException(
                'token-pilot-micrometer POM must expose core and micrometer-core as compile dependencies.'
            )
        }
        def forbiddenMicrometerOwners = micrometerPom.dependencies.dependency.findAll {
            it.groupId.text() == 'cloud.token-pilot' &&
                it.artifactId.text() in [
                    'token-pilot-budget',
                    'token-pilot-notification'
                ]
        }
        if (!forbiddenMicrometerOwners.isEmpty()) {
            throw new GradleException(
                'token-pilot-micrometer POM must keep budget and notification owners optional.'
            )
        }
    }
}

tasks.register('verifyCompatibilityMatrix') {
    group = 'verification'
    description = 'Verifies the Java 25, Spring Boot 4.1.0, and Spring AI 2.0.0 compatibility baseline.'
    dependsOn tasks.named('verifyPublicationMetadata')
    dependsOn ':token-pilot-core:classes'
    dependsOn ':token-pilot-core:generateMetadataFileForMavenJavaPublication'

    doLast {
        def expectedJavaVersion = compatibilityMatrix.java as Integer
        def expectedClassMajorVersion = expectedJavaVersion + 44

        subprojects.each { moduleProject ->
            moduleProject.tasks.withType(JavaCompile).each { compileTask ->
                def configuredRelease = compileTask.options.release.orNull
                if (configuredRelease != expectedJavaVersion) {
                    throw new GradleException(
                        "${compileTask.path} must compile with --release ${expectedJavaVersion}, but was ${configuredRelease}."
                    )
                }
            }
        }

        def coreProject = project(':token-pilot-core')
        def corePomFile = coreProject.layout.buildDirectory
            .file('publications/mavenJava/pom-default.xml')
            .get()
            .asFile
        def corePom = new XmlSlurper(false, false).parse(corePomFile)
        def forbiddenGroups = [
            'org.springframework',
            'org.springframework.ai',
            'io.micrometer',
            'io.projectreactor'
        ]
        def forbiddenPomDependencies = corePom.depthFirst().findAll { node ->
            node.name() == 'dependency' && forbiddenGroups.any {
                node.groupId.text() == it || node.groupId.text().startsWith("${it}.")
            }
        }

        if (!forbiddenPomDependencies.isEmpty()) {
            throw new GradleException(
                "token-pilot-core POM must not expose Spring, Spring AI, Micrometer, or Reactor dependencies."
            )
        }

        if (corePom.dependencyManagement.size() != 0) {
            throw new GradleException('token-pilot-core POM must not import a dependency-management BOM.')
        }

        def coreModuleFile = coreProject.layout.buildDirectory
            .file('publications/mavenJava/module.json')
            .get()
            .asFile
        def coreModule = new JsonSlurper().parse(coreModuleFile)
        def publishedVariants = coreModule.variants.findAll {
            it.name == 'apiElements' || it.name == 'runtimeElements'
        }

        if (publishedVariants.size() != 2) {
            throw new GradleException('token-pilot-core module metadata must publish API and runtime variants.')
        }

        publishedVariants.each { variant ->
            def publishedJavaVersion = variant.attributes['org.gradle.jvm.version']
            if (publishedJavaVersion != expectedJavaVersion) {
                throw new GradleException(
                    "token-pilot-core ${variant.name} must target Java ${expectedJavaVersion}, but was ${publishedJavaVersion}."
                )
            }

            def forbiddenModuleDependencies = (variant.dependencies ?: []).findAll { dependency ->
                forbiddenGroups.any {
                    dependency.group == it || dependency.group?.startsWith("${it}.")
                }
            }
            def forbiddenModuleConstraints = (variant.dependencyConstraints ?: []).findAll { dependency ->
                forbiddenGroups.any {
                    dependency.group == it || dependency.group?.startsWith("${it}.")
                }
            }

            if (!forbiddenModuleDependencies.isEmpty() || !forbiddenModuleConstraints.isEmpty()) {
                throw new GradleException(
                    "token-pilot-core ${variant.name} must not expose Spring, Spring AI, Micrometer, or Reactor metadata."
                )
            }
        }

        def coreClassFiles = coreProject.fileTree(
            coreProject.layout.buildDirectory.dir('classes/java/main')
        ) {
            include '**/*.class'
        }.files

        if (coreClassFiles.isEmpty()) {
            throw new GradleException('No token-pilot-core class files were found for bytecode verification.')
        }

        coreClassFiles.each { classFile ->
            classFile.withDataInputStream { stream ->
                stream.skipBytes(6)
                def majorVersion = stream.readUnsignedShort()
                if (majorVersion != expectedClassMajorVersion) {
                    throw new GradleException(
                        "${classFile.name} must use Java ${expectedJavaVersion} class version " +
                            "${expectedClassMajorVersion}, but was ${majorVersion}."
                    )
                }
            }
        }

        def resolvedVersions = [:]
        project(':token-pilot-sample-app')
            .configurations
            .runtimeClasspath
            .incoming
            .resolutionResult
            .allComponents
            .each { component ->
                if (component.id instanceof ModuleComponentIdentifier) {
                    resolvedVersions["${component.id.group}:${component.id.module}"] = component.id.version
                }
            }

        def requiredVersions = [
            'org.springframework.boot:spring-boot': compatibilityMatrix.springBoot,
            'org.springframework.ai:spring-ai-model': compatibilityMatrix.springAi,
            'org.springframework.ai:spring-ai-client-chat': compatibilityMatrix.springAi
        ]

        requiredVersions.each { coordinate, expectedVersion ->
            def actualVersion = resolvedVersions[coordinate]
            if (actualVersion != expectedVersion) {
                throw new GradleException(
                    "${coordinate} must resolve to ${expectedVersion}, but was ${actualVersion}."
                )
            }
        }

        def unsupportedSpringAiVersions = resolvedVersions.findAll { coordinate, version ->
            coordinate.startsWith('org.springframework.ai:') && version != compatibilityMatrix.springAi
        }
        if (!unsupportedSpringAiVersions.isEmpty()) {
            throw new GradleException(
                "All Spring AI modules must resolve to ${compatibilityMatrix.springAi}: ${unsupportedSpringAiVersions}"
            )
        }

        def unsupportedSpringBootVersions = resolvedVersions.findAll { coordinate, version ->
            coordinate.startsWith('org.springframework.boot:') && version != compatibilityMatrix.springBoot
        }
        if (!unsupportedSpringBootVersions.isEmpty()) {
            throw new GradleException(
                "All Spring Boot modules must resolve to ${compatibilityMatrix.springBoot}: ${unsupportedSpringBootVersions}"
            )
        }

        def springAiClassOwners = [:].withDefault { [] }
        project(':token-pilot-sample-app')
            .configurations
            .runtimeClasspath
            .incoming
            .artifacts
            .artifacts
            .findAll {
                it.id.componentIdentifier instanceof ModuleComponentIdentifier &&
                    it.file.name.endsWith('.jar')
            }
            .each { artifact ->
                new JarFile(artifact.file).withCloseable { jar ->
                    jar.entries().findAll { entry ->
                        !entry.directory &&
                            entry.name.startsWith('org/springframework/ai/') &&
                            entry.name.endsWith('.class') &&
                            !entry.name.endsWith('/module-info.class') &&
                            !entry.name.endsWith('/package-info.class')
                    }.each { entry ->
                        springAiClassOwners[entry.name] << artifact.file.name
                    }
                }
            }

        def duplicateSpringAiClasses = springAiClassOwners.findAll { className, owners ->
            owners.size() > 1
        }
        if (!duplicateSpringAiClasses.isEmpty()) {
            throw new GradleException(
                "Duplicate Spring AI classes were found on the starter runtime classpath: ${duplicateSpringAiClasses}"
            )
        }
    }
}

def coreConsumerDirectory = layout.buildDirectory.dir('compatibility/core-consumer')

tasks.register('prepareCoreConsumer') {
    group = 'verification'
    description = 'Generates a repository-external-style Java 25 consumer for the published core artifact.'
    dependsOn ':token-pilot-core:publishMavenJavaPublicationToStagingRepository'
    outputs.dir(coreConsumerDirectory)

    doLast {
        def consumerDirectory = coreConsumerDirectory.get().asFile
        delete(consumerDirectory)

        def sourceDirectory = new File(consumerDirectory, 'src/main/java/compatibility')
        sourceDirectory.mkdirs()

        new File(consumerDirectory, 'settings.gradle').text = """
rootProject.name = 'token-pilot-core-consumer'
""".stripIndent().trim() + System.lineSeparator()

        new File(consumerDirectory, 'build.gradle').text = """
plugins {
    id 'application'
}

repositories {
    maven { url = uri('${project(':token-pilot-core').layout.buildDirectory.dir('staging-deploy').get().asFile.toURI()}') }
    mavenCentral()
}

dependencies {
    implementation 'cloud.token-pilot:token-pilot-core:${project.version}'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(${compatibilityMatrix.java})
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = ${compatibilityMatrix.java}
}

application {
    mainClass = 'compatibility.CoreConsumer'
}

def forbiddenCoreRuntimeGroups = [
    'org.springframework',
    'org.springframework.ai',
    'io.micrometer',
    'io.projectreactor'
]

tasks.register('verifyCoreRuntimeClasspath') {
    group = 'verification'
    description = 'Verifies that the published core artifact has no forbidden transitive runtime dependencies.'

    doLast {
        def forbiddenComponents = configurations.runtimeClasspath
            .incoming
            .resolutionResult
            .allComponents
            .findAll { component ->
                def group = component.moduleVersion?.group
                group != null && forbiddenCoreRuntimeGroups.any { forbiddenGroup ->
                    group == forbiddenGroup || group.startsWith(forbiddenGroup + '.')
                }
            }

        if (!forbiddenComponents.isEmpty()) {
            throw new GradleException(
                'token-pilot-core runtime classpath contains forbidden dependencies: ' +
                    forbiddenComponents.collect { it.id.displayName }
            )
        }
    }
}

tasks.named('run') {
    dependsOn tasks.named('verifyCoreRuntimeClasspath')
}
""".stripIndent().trim() + System.lineSeparator()

        new File(sourceDirectory, 'CoreConsumer.java').text = """
package compatibility;

import io.tokenpilot.core.CoreComponents;
import io.tokenpilot.core.TokenBudget;
import io.tokenpilot.core.TokenEstimator;
import io.tokenpilot.core.domain.AdmissionReason;
import io.tokenpilot.core.domain.AdmissionStatus;
import io.tokenpilot.core.domain.BudgetResult;
import io.tokenpilot.core.domain.Cost;
import io.tokenpilot.core.domain.TokenCountResult;
import io.tokenpilot.core.domain.TokenCountScope;
import java.math.BigDecimal;
import java.util.Currency;

public final class CoreConsumer {
    private CoreConsumer() {
    }

    public static void main(String[] args) {
        Cost cost = Cost.of(new BigDecimal("1.25"), Currency.getInstance("USD"));
        if (!cost.equals(Cost.zero(Currency.getInstance("USD")).add(cost))) {
            throw new IllegalStateException("Token Pilot core consumer verification failed");
        }

        TokenEstimator estimator = CoreComponents.utf8ByteHeuristicTokenEstimator();
        TokenBudget tokenBudget = CoreComponents.tokenBudget(CoreComponents.defaultModelRegistry());
        TokenCountResult actual = estimator.estimate("hello");
        if (!actual.isCounted()
                || actual.isExact()
                || actual.tokens().orElseThrow() != 2L
                || actual.safeUpperBoundTokens().orElseThrow() != 5L
                || actual.scope() != TokenCountScope.TEXT_ONLY) {
            throw new IllegalStateException("Token Pilot estimator consumer verification failed");
        }

        BudgetResult incomplete = tokenBudget.check("gpt-4o-mini", actual, 0);
        if (incomplete.status() != AdmissionStatus.INDETERMINATE
                || incomplete.reason() != AdmissionReason.INCOMPLETE_SCOPE
                || incomplete.fits()
                || !incomplete.canonicalModelId().orElseThrow()
                    .equals("gpt-4o-mini-2024-07-18")
                || !incomplete.estimatorDescriptor().estimatorId()
                    .equals("tokenpilot-utf8-byte-heuristic")
                || !incomplete.estimatorDescriptor().estimatorVersion().equals("1")
                || !incomplete.tokenizationBasis().id().equals("BYTE_LEVEL_BPE_UTF8")) {
            throw new IllegalStateException("Token Pilot preflight consumer verification failed");
        }

        TokenCountResult huge = estimator.estimate("x".repeat(512_004));
        BudgetResult exceeds = tokenBudget.check("gpt-4o-mini", huge, 0);
        if (exceeds.status() != AdmissionStatus.EXCEEDS
                || exceeds.reason() != AdmissionReason.CONTEXT_EXCEEDED
                || exceeds.fits()) {
            throw new IllegalStateException("Token Pilot context consumer verification failed");
        }

        BudgetResult reservedExceeds = tokenBudget.check("gpt-4o-mini", actual, 127_996);
        if (reservedExceeds.status() != AdmissionStatus.EXCEEDS
                || reservedExceeds.reason() != AdmissionReason.CONTEXT_EXCEEDED) {
            throw new IllegalStateException("Token Pilot reserved output verification failed");
        }

        System.out.println("short model=" + incomplete.canonicalModelId().orElseThrow()
                + " estimator=" + incomplete.estimatorDescriptor().estimatorId()
                + "/" + incomplete.estimatorDescriptor().estimatorVersion()
                + " compatibility=" + incomplete.tokenizationBasis().id()
                + " reason=" + incomplete.reason());
        System.out.println("huge input status=" + exceeds.status()
                + " reason=" + exceeds.reason());
        System.out.println("token-pilot-core Java 25 consumer OK");
    }
}
""".stripIndent().trim() + System.lineSeparator()
    }
}

tasks.register('verifyCoreConsumer', Exec) {
    group = 'verification'
    description = 'Compiles and runs the generated Java 25 core-only consumer.'
    dependsOn tasks.named('prepareCoreConsumer')
    workingDir coreConsumerDirectory
    commandLine rootProject.file('gradlew').absolutePath, '--no-daemon', 'run'
}

def micrometerConsumerDirectory = layout.buildDirectory.dir(
    'compatibility/micrometer-consumer'
)

tasks.register('prepareMicrometerConsumer') {
    group = 'verification'
    description = 'Generates external consumers for optional Micrometer owners and core-only autoconfiguration.'
    dependsOn ':token-pilot-core:publishMavenJavaPublicationToStagingRepository'
    dependsOn ':token-pilot-autoconfigure:publishMavenJavaPublicationToStagingRepository'
    dependsOn ':token-pilot-micrometer:publishMavenJavaPublicationToStagingRepository'
    dependsOn ':token-pilot-budget:publishMavenJavaPublicationToStagingRepository'
    dependsOn ':token-pilot-notification:publishMavenJavaPublicationToStagingRepository'
    outputs.dir(micrometerConsumerDirectory)
    outputs.upToDateWhen { false }

    doLast {
        def consumerDirectory = micrometerConsumerDirectory.get().asFile
        delete(consumerDirectory)

        def coreOnlySource = new File(
            consumerDirectory,
            'core-only/src/main/java/compatibility'
        )
        def allOwnersSource = new File(
            consumerDirectory,
            'all-owners/src/main/java/compatibility'
        )
        def autoConfigureSource = new File(
            consumerDirectory,
            'autoconfigure-core-only/src/main/java/compatibility'
        )
        coreOnlySource.mkdirs()
        allOwnersSource.mkdirs()
        autoConfigureSource.mkdirs()

        new File(consumerDirectory, 'settings.gradle').text = """
rootProject.name = 'token-pilot-micrometer-consumer'
include 'core-only', 'all-owners', 'autoconfigure-core-only'
""".stripIndent().trim() + System.lineSeparator()

        def stagingRepositories = [
            project(':token-pilot-core'),
            project(':token-pilot-autoconfigure'),
            project(':token-pilot-micrometer'),
            project(':token-pilot-budget'),
            project(':token-pilot-notification')
        ].collect { moduleProject ->
            "maven { url = uri('${moduleProject.layout.buildDirectory.dir('staging-deploy').get().asFile.toURI()}') }"
        }.join(System.lineSeparator() + '        ')

        new File(consumerDirectory, 'build.gradle').text = """
subprojects {
    apply plugin: 'application'

    configurations.configureEach {
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }

    repositories {
        ${stagingRepositories}
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(${compatibilityMatrix.java})
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = ${compatibilityMatrix.java}
    }
}
""".stripIndent().trim() + System.lineSeparator()

        new File(consumerDirectory, 'core-only/build.gradle').text = """
dependencies {
    implementation 'cloud.token-pilot:token-pilot-micrometer:${project.version}'
}

application {
    mainClass = 'compatibility.MicrometerCoreConsumer'
}

tasks.register('verifyOptionalOwnersAbsent') {
    doLast {
        def forbidden = configurations.runtimeClasspath.incoming.resolutionResult
            .allComponents
            .findAll { component ->
                component.moduleVersion?.group == 'cloud.token-pilot' &&
                    component.moduleVersion?.name in [
                        'token-pilot-budget',
                        'token-pilot-notification'
                    ]
            }
        if (!forbidden.isEmpty()) {
            throw new GradleException('Optional owners leaked into micrometer runtime: ' + forbidden)
        }
    }
}

tasks.named('run') {
    dependsOn tasks.named('verifyOptionalOwnersAbsent')
}
""".stripIndent().trim() + System.lineSeparator()

        new File(coreOnlySource, 'MicrometerCoreConsumer.java').text = """
package compatibility;

import io.micrometer.core.instrument.simple.SimpleMeterRegistry;
import io.tokenpilot.core.domain.MissingPricingPolicy;
import io.tokenpilot.core.domain.PricingMissingEvent;
import io.tokenpilot.core.domain.PricingResolution;
import io.tokenpilot.micrometer.internal.CoreMetricsPublisher;
import io.tokenpilot.micrometer.internal.LedgerMicrometerComponents;
import java.lang.reflect.Method;
import java.util.Arrays;

public final class MicrometerCoreConsumer {
    private MicrometerCoreConsumer() {
    }

    public static void main(String[] args) throws Exception {
        for (Method method : LedgerMicrometerComponents.class.getDeclaredMethods()) {
            String signature = method.toGenericString();
            if (signature.contains("io.tokenpilot.budget")
                    || signature.contains("io.tokenpilot.notification")) {
                throw new IllegalStateException("Optional owner leaked into core factory method table");
            }
        }
        for (String optionalType : Arrays.asList(
                "io.tokenpilot.budget.ReservationAccountingListener",
                "io.tokenpilot.notification.BudgetNotificationLifecycleListener")) {
            try {
                Class.forName(optionalType);
                throw new IllegalStateException("Optional owner is unexpectedly present: " + optionalType);
            } catch (ClassNotFoundException expected) {
                // Expected for the core + micrometer-only consumer.
            }
        }

        var registry = new SimpleMeterRegistry();
        CoreMetricsPublisher publisher =
                LedgerMicrometerComponents.coreMetricsPublisher(registry);
        publisher.onPricingMissing(new PricingMissingEvent(
                MissingPricingPolicy.FAIL_CLOSED,
                PricingResolution.MISSING_PLAN
        ));
        double count = registry.get("tokenpilot.pricing.missing")
                .tag("policy", "fail_closed")
                .counter()
                .count();
        if (count != 1.0d) {
            throw new IllegalStateException("Core Micrometer publisher verification failed");
        }
        System.out.println("token-pilot-micrometer core-only consumer OK");
    }
}
""".stripIndent().trim() + System.lineSeparator()

        new File(consumerDirectory, 'all-owners/build.gradle').text = """
dependencies {
    implementation 'cloud.token-pilot:token-pilot-micrometer:${project.version}'
    implementation 'cloud.token-pilot:token-pilot-budget:${project.version}'
    implementation 'cloud.token-pilot:token-pilot-notification:${project.version}'
}

application {
    mainClass = 'compatibility.MicrometerOwnerConsumer'
}
""".stripIndent().trim() + System.lineSeparator()

        new File(allOwnersSource, 'MicrometerOwnerConsumer.java').text = """
package compatibility;

import io.micrometer.core.instrument.simple.SimpleMeterRegistry;
import io.tokenpilot.budget.ReservationAccountingListener;
import io.tokenpilot.micrometer.internal.BudgetMicrometerComponents;
import io.tokenpilot.micrometer.internal.NotificationMicrometerComponents;
import io.tokenpilot.notification.BudgetNotificationLifecycleListener;

public final class MicrometerOwnerConsumer {
    private MicrometerOwnerConsumer() {
    }

    public static void main(String[] args) {
        var registry = new SimpleMeterRegistry();
        Object budget = BudgetMicrometerComponents.budgetMetricsPublisher(registry);
        Object notification = NotificationMicrometerComponents
                .notificationMetricsPublisher(registry);
        if (!(budget instanceof ReservationAccountingListener)
                || !(notification instanceof BudgetNotificationLifecycleListener)) {
            throw new IllegalStateException("Owner Micrometer composition verification failed");
        }
        System.out.println("token-pilot-micrometer all-owners consumer OK");
    }
}
""".stripIndent().trim() + System.lineSeparator()

        new File(
            consumerDirectory,
            'autoconfigure-core-only/build.gradle'
        ).text = """
dependencies {
    implementation 'cloud.token-pilot:token-pilot-autoconfigure:${project.version}'
    implementation 'org.springframework.boot:spring-boot:${compatibilityMatrix.springBoot}'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:${compatibilityMatrix.springBoot}'
}

application {
    mainClass = 'compatibility.AutoConfigureCoreConsumer'
}

tasks.register('verifyOptionalAdaptersAbsent') {
    doLast {
        def forbidden = configurations.runtimeClasspath.incoming.resolutionResult
            .allComponents
            .findAll { component ->
                component.moduleVersion?.group == 'cloud.token-pilot' &&
                    component.moduleVersion?.name in [
                        'token-pilot-budget',
                        'token-pilot-notification',
                        'token-pilot-spring-ai',
                        'token-pilot-micrometer',
                        'token-pilot-starter'
                    ]
            }
        if (!forbidden.isEmpty()) {
            throw new GradleException('Optional adapters leaked into core autoconfigure runtime: ' + forbidden)
        }
    }
}

tasks.named('run') {
    dependsOn tasks.named('verifyOptionalAdaptersAbsent')
}
""".stripIndent().trim() + System.lineSeparator()

        new File(autoConfigureSource, 'AutoConfigureCoreConsumer.java').text = """
package compatibility;

import io.tokenpilot.core.PricingRegistry;
import io.tokenpilot.core.TokenBudget;
import io.tokenpilot.core.TokenEstimator;
import org.springframework.boot.SpringApplication;
import org.springframework.boot.WebApplicationType;
import org.springframework.boot.autoconfigure.EnableAutoConfiguration;
import org.springframework.boot.SpringBootConfiguration;
import org.springframework.context.ConfigurableApplicationContext;

@SpringBootConfiguration
@EnableAutoConfiguration
public class AutoConfigureCoreConsumer {
    public static void main(String[] args) {
        SpringApplication application = new SpringApplication(
                AutoConfigureCoreConsumer.class
        );
        application.setWebApplicationType(WebApplicationType.NONE);
        application.setLogStartupInfo(false);
        try (ConfigurableApplicationContext context = application.run(args)) {
            context.getBean(PricingRegistry.class);
            context.getBean(TokenBudget.class);
            context.getBean(TokenEstimator.class);
        }
        System.out.println("token-pilot-autoconfigure core-only consumer OK");
    }
}
""".stripIndent().trim() + System.lineSeparator()
    }
}

tasks.register('verifyMicrometerConsumer', Exec) {
    group = 'verification'
    description = 'Runs Micrometer owner consumers and core-only autoconfiguration without optional adapters.'
    dependsOn tasks.named('prepareMicrometerConsumer')
    workingDir micrometerConsumerDirectory
    commandLine rootProject.file('gradlew').absolutePath,
        '--no-daemon',
        ':core-only:run',
        ':all-owners:run',
        ':autoconfigure-core-only:run'
}

tasks.named('check') {
    dependsOn tasks.named('verifyCompatibilityMatrix')
    dependsOn tasks.named('verifyCoreConsumer')
    dependsOn tasks.named('verifyMicrometerConsumer')
}
