    public static void main(String[] args) {
        SpringApplication application = new SpringApplication(StarterConsumer.class);
        application.setWebApplicationType(WebApplicationType.NONE);
        application.setLogStartupInfo(false);
        application.setDefaultProperties(Map.of(
            "spring.ai.openai.api-key", "published-consumer-test-key",
            "token-pilot.budget.enabled", "true",
            "token-pilot.notification.enabled", "true",
            "token-pilot.metrics.enabled", "false"
        ));

        try (ConfigurableApplicationContext context = application.run(args)) {
            AtomicBudgetStateStore atomicStore = context.getBean(AtomicBudgetStateStore.class);
            if (atomicStore != context.getBean(BudgetStateStore.class)
                    || atomicStore != context.getBean(ReservationAccounting.class)) {
                throw new IllegalStateException("Budget admission/accounting bean identity was split");
            }
            context.getBean(LedgerAdvisor.class);
            context.getBean(LedgerChatClientBuilderCustomizer.class);
            context.getBean(BudgetNotificationService.class);
            context.getBean(OpenAiChatModel.class);
        }
        System.out.println("token-pilot-starter published consumer OK");
    }
}
